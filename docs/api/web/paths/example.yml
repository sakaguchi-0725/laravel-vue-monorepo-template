post:
  operationId: createExample
  summary: 送信された値をそのまま返す
  description: 受け取ったリクエストボディを検証し、同じ内容をそのまま返す。
  tags:
    - Example
  requestBody:
    required: true
    content:
      application/json:
        schema: &Example
          type: object
          required:
            - name
            - email
          properties:
            name:
              type: string
              description: 名前
              minLength: 1
              maxLength: 50
              examples:
                - 山田太郎
            email:
              type: string
              description: メールアドレス
              format: email
              examples:
                - taro@example.com
  responses:
    '200':
      description: 正常系
      content:
        application/json:
          schema: *Example
    '400':
      $ref: '../../shared/error.yml#/components/responses/BadRequest'
