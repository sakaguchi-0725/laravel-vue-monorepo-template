[tasks.setup]
description = "初期セットアップ（.env作成、Playwrightのブラウザ取得）"
run = [
  "test -f .env || cp .env.example .env",
  "pnpm exec playwright install chromium",
]

[tasks."api:docs"]
description = "OpenAPI仕様書からHTMLドキュメントを生成して開く"
run = "pnpm --package=@redocly/cli dlx redocly build-docs ../../docs/api/admin/openapi.yml --output ../../docs/api/admin.html && open ../../docs/api/admin.html"

[tasks."api:gen"]
description = "OpenAPI仕様書からTypeScriptの型を生成"
run = "pnpm exec openapi-typescript ../../docs/api/admin/openapi.yml --output src/shared/api/schema.ts --export-type"

[tasks.storybook]
description = "Storybookを起動"
run = "pnpm storybook"

[tasks.test]
description = "Storybookのplay関数テスト（vitest browser）を実行"
run = "pnpm test-storybook"

[tasks."lint:staged"]
description = "指定ファイルにESLintを実行する（lefthook用）"
run = "pnpm exec eslint --no-warn-ignored $@"
