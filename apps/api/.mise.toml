[tasks.setup]
description = "初期セットアップ（.env作成、マイグレーション）"
depends = ["docker:up"]
run = [
  "test -f .env || cp .env.example .env",
  "docker compose exec api php artisan migrate",
]

[tasks."migrate:new"]
description = "マイグレーションファイルの作成"
run = "docker compose exec api php artisan make:migration {{arg(name=\"name\")}}"

[tasks."migrate:up"]
description = "マイグレーションの適用"
run = "docker compose exec api php artisan migrate"

[tasks."migrate:down"]
description = "マイグレーションを1つ戻す"
run = "docker compose exec api php artisan migrate:rollback --step=1"

[tasks."ide:helper"]
description = "モデルの属性・スコープの PHPDoc をモデルファイルへ書き込む（エディタ補完用）"
run = "docker compose exec api php artisan ide-helper:models -W"

[tasks.test]
description = "テストの実行（PHPUnit / paratest による並列実行）"
run = "docker compose exec api php artisan test --parallel"

[tasks.format]
description = "PHPコードの整形（Pint）"
run = "docker compose exec api composer run format"

[tasks."format:check"]
description = "PHPコードの整形チェック（Pint、書き換えなし）"
run = "docker compose exec api composer run format:check"

[tasks.lint]
description = "PHPの静的解析（PHPStan / Larastan / PHPat）"
run = "docker compose exec api composer run lint"

[tasks."format:staged"]
description = "指定ファイルをPintで整形する（lefthook用）"
run = "docker compose exec -T api ./vendor/bin/pint $@"
