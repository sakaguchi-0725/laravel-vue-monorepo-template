[tools]
node = "26.7.0"
pnpm = "11.22.0"
lefthook = "2.1.10"

[tasks.setup]
description = "依存のインストール、git hooksの登録、各アプリのセットアップ"
run = [
  "pnpm install",
  "lefthook install",
  "mise -C apps/web run setup",
  "mise -C apps/admin run setup",
  "mise -C apps/api run setup",
]

[tasks."docker:up"]
description = "コンテナの起動"
run = "docker compose up -d"

[tasks."docker:down"]
description = "コンテナの停止"
run = "docker compose down"

[tasks."docker:log"]
description = "apiコンテナのログ表示"
run = "docker compose logs -f api"

[tasks."api:lint"]
description = "OpenAPI仕様書のlint"
run = "pnpm --package=@redocly/cli dlx redocly lint docs/api/web/openapi.yml docs/api/admin/openapi.yml"

[tasks."api:docs"]
description = "OpenAPI仕様書のHTMLドキュメント生成"
run = """
pnpm --package=@redocly/cli dlx redocly build-docs docs/api/web/openapi.yml -o docs/api/web.html
pnpm --package=@redocly/cli dlx redocly build-docs docs/api/admin/openapi.yml -o docs/api/admin.html
open docs/api/web.html docs/api/admin.html
"""

[tasks."format:staged"]
description = "指定ファイルをPrettierで整形する（lefthook用）"
run = "pnpm exec prettier --write $@"
