assert_lefthook_installed: true
glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: web
      glob: 'apps/web/**/*.{ts,vue}'
      group:
        piped: true
        jobs:
          - name: format
            run: mise run format:staged -- {staged_files}
            stage_fixed: true
          - name: lint
            root: apps/web/
            run: mise run lint:staged -- {staged_files}

    - name: admin
      glob: 'apps/admin/**/*.{ts,vue}'
      group:
        piped: true
        jobs:
          - name: format
            run: mise run format:staged -- {staged_files}
            stage_fixed: true
          - name: lint
            root: apps/admin/
            run: mise run lint:staged -- {staged_files}

    - name: packages
      glob: 'packages/**/*.{ts,vue,json}'
      run: mise run format:staged -- {staged_files}
      stage_fixed: true

    - name: api
      root: apps/api/
      glob: 'apps/api/**/*.php'
      group:
        piped: true
        jobs:
          - name: format
            run: mise run format:staged -- {staged_files}
            stage_fixed: true
          - name: lint
            run: mise run lint
